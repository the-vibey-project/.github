name: Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. The fields below are what it takes to
        reproduce a problem on the first try, which is the fastest route to a fix.

        These are **macOS and Linux** projects. Not sure it is a bug? Ask in
        [Q&A](https://github.com/the-vibey-project/vibey/discussions/categories/q-a)
        first; that is never a wasted question. Please search existing issues too.

  - type: input
    id: package
    attributes:
      label: Package and version
      description: The package and its exact version — `pip show vibey-engine`, or `<command> --version`.
      placeholder: "vibey-engine 4.2.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python
      placeholder: "macOS 15.6 / Python 3.12.13"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the actual output, including the full error. Redact tokens and secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: The exact commands, from a clean state. If you cannot reduce it, say what you tried.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this organisation's [Code of Conduct](https://github.com/the-vibey-project/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
